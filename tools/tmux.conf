set -g status off
set -g mouse off
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour42
set -g history-limit 5000

# Shell del usuario: zsh interactivo normal, para que se cargue ~/.zshrc
# (oh-my-zsh + starship), cuyo prompt muestra el directorio y la hora.
set -g default-shell /usr/bin/zsh
set -g default-command "zsh -i"
